<body>
  <script>
    // Apply the saved theme before first paint (no light flash in dark mode).

      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.body.classList.add(dark ? 'dark-theme' : 'light-theme');
